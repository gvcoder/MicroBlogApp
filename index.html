<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark px-3" id="main-nav" style="display:none;">
    <span class="navbar-brand fw-bold">📝 Personal Notes</span>
    <div class="d-flex align-items-center gap-2">
      <span class="text-light small" id="nav-user-email"></span>
      <button class="btn btn-outline-light btn-sm" id="btn-logout">Logout</button>
    </div>
  </nav>

  <!-- Auth Section -->
  <div id="auth-section" class="container mt-5" style="max-width:420px;">
    <!-- Login Form -->
    <div id="login-form">
      <h4 class="mb-3">Sign In</h4>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" />
      </div>
      <button class="btn btn-primary w-100" id="btn-login">
        <span id="login-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
        Sign In
      </button>
      <p class="mt-3 text-center small">No account? <a href="#" id="link-to-register">Register</a></p>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none;">
      <h4 class="mb-3">Create Account</h4>
      <div id="register-error" class="alert alert-danger d-none"></div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="reg-email" placeholder="you@example.com" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="reg-password" />
        <div class="form-text">Min 8 chars, uppercase, lowercase and number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="reg-password-confirm" />
      </div>
      <button class="btn btn-success w-100" id="btn-register">
        <span id="register-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
        Register
      </button>
      <p class="mt-3 text-center small">Already have an account? <a href="#" id="link-to-login">Sign In</a></p>
    </div>
  </div>

  <!-- Notes App Section -->
  <div id="app-section" style="display:none;">
    <div class="container-fluid mt-3">
      <!-- Toolbar -->
      <div class="row mb-3 align-items-center">
        <div class="col-md-5">
          <input type="text" class="form-control" id="search-input" placeholder="Search notes…" />
        </div>
        <div class="col-md-4">
          <select class="form-select" id="tag-filter">
            <option value="">All tags</option>
          </select>
        </div>
        <div class="col-md-3 text-end">
          <button class="btn btn-primary" id="btn-new-note">+ New Note</button>
        </div>
      </div>

      <!-- Loading indicator -->
      <div id="notes-loading" class="text-center py-4 d-none">
        <div class="spinner-border text-primary"></div>
      </div>

      <!-- Empty state -->
      <div id="notes-empty" class="text-center text-muted py-5 d-none">
        <p>No notes yet. Click <strong>+ New Note</strong> to get started.</p>
      </div>

      <!-- Notes grid -->
      <div class="row g-3" id="notes-grid"></div>
    </div>
  </div>

  <!-- Note Editor Modal -->
  <div class="modal fade" id="note-modal" tabindex="-1" aria-labelledby="note-modal-label" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="note-modal-label">New Note</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="note-error" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="note-title" maxlength="200" placeholder="Note title" />
            <div class="form-text text-end"><span id="title-count">0</span>/200</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Content <span class="text-danger">*</span></label>
            <textarea class="form-control" id="note-content" rows="8" maxlength="10000" placeholder="Write your note…"></textarea>
            <div class="form-text text-end"><span id="content-count">0</span>/10000</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Tags <span class="text-muted small">(comma-separated)</span></label>
            <input type="text" class="form-control" id="note-tags" placeholder="work, ideas, todo" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger me-auto d-none" id="btn-delete-note">Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="btn-save-note">
            <span id="save-spinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
